name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "rust-toolchain.toml has no channel" >&2
            exit 1
          fi
          rustup toolchain install "$channel" --profile minimal --no-self-update

      - name: Test
        run: cargo test --locked

      - name: Test installer
        run: sh tests/install_test.sh

      - name: Test workflows
        run: sh tests/workflows_test.sh

      - name: Check install.sh
        if: runner.os == 'Linux'
        run: sh -n install.sh
