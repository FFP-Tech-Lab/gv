[package]
name = "gv"
version = "0.1.0"
edition = "2021"
description = "Go version manager"
license = "MIT"
authors = ["FFP Tech Lab"]
repository = "https://github.com/FFP-Tech-Lab/gv"
readme = "README.md"

[[bin]]
name = "gv"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[features]
default = ["tui"]
tui = ["dep:crossterm", "dep:ratatui"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", optional = true }
flate2 = "1.0"
indicatif = "0.18"
ratatui = { version = "0.30.2", optional = true, default-features = false, features = ["crossterm", "layout-cache", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "1.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
